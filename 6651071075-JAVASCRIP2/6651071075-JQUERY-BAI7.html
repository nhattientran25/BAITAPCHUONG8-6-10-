<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển hướng đến đường link</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h1>Nhập đường link và nhấn "Submit" để chuyển hướng</h1>
    <form id="linkForm">
        <input type="url" id="linkInput" placeholder="Nhập đường link" required>
        <button type="submit">Submit</button>
    </form>

    <script>
        $(function () {
            $("#linkForm").on("submit", function (event) {
                event.preventDefault();

                var link = $("#linkInput").val().trim();
                if (window.confirm("Bạn có muốn chuyển đến " + link + " không?")) {
                    window.location.href = link;
                }
            });
        });
    </script>
</body>
</html>
