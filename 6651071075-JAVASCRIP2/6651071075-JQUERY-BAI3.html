<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>CAU 3</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <table id="sampleTable" border="1">
        <tr>
            <td>Row1 cell1</td>
            <td>Row1 cell2</td>
        </tr>
        <tr>
            <td>Row2 cell1</td>
            <td>Row2 cell2</td>
        </tr>
    </table>

    <br>

    <input type="button" id="insertRow" value="Insert row">

    <script>
        $(function () {
            $("#insertRow").on("click", function () {
                var rowIndex = $("#sampleTable tr").length + 1;
                var $row = $("<tr>");

                $row.append($("<td>").text("Row" + rowIndex + " cell1"));
                $row.append($("<td>").text("Row" + rowIndex + " cell2"));
                $("#sampleTable").append($row);
            });
        });
    </script>
</body>
</html>
