<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 30px;
        }
    </style>

    <meta charset="utf-8">
    <title>BAI 31</title>

    <script>
        function removecolor() {
            var select = document.getElementById("colorSelect");

            select.remove(select.selectedIndex);
        }
    </script>
</head>

<body>

    <form>
        <select id="colorSelect">
            <option>Red</option>
            <option>Green</option>
            <option>White</option>
            <option>Black</option>
        </select>

        <input type="button" onclick="removecolor()" value="Select and Remove">
    </form>

</body>

</html>
